<!DOCTYPE html>
<html>
<head>

    <title>Temperature Converter</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
            margin-top: 100px;
        }

        .box {
            background-color: white;
            width: 350px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input, select, button {
            width: 90%;
            padding: 10px;
            margin: 8px;
        }

        button {
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>

</head>

<body>

<div class="box">

    <h2>Temperature Converter</h2>

    <form action="convert" method="post">

        <input type="number"
               step="any"
               name="temperature"
               placeholder="Enter temperature"
               required>

        <select name="from">
            <option value="Celsius">Celsius</option>
            <option value="Fahrenheit">Fahrenheit</option>
            <option value="Kelvin">Kelvin</option>
        </select>

        <select name="to">
            <option value="Celsius">Celsius</option>
            <option value="Fahrenheit">Fahrenheit</option>
            <option value="Kelvin">Kelvin</option>
        </select>

        <button type="submit">Convert</button>

    </form>

</div>

</body>
</html>
